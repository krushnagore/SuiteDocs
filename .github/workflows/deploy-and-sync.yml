name: Scheduled Documentation Sync & Deploy

on:
  # Automated Cloud Schedule: Runs weekly on Sunday at 02:00 UTC
  schedule:
    - cron: '0 2 * * 0'

  # Manual On-Demand Trigger from GitHub UI
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force clean rebuild of all 55 modules'
        type: boolean
        required: false
        default: false

# Sets permissions for GitHub Pages and repository commits
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Fonts for PDF Rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation fonts-roboto

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Documentation Sync Pipeline
        run: |
          python sync_manager.py --run-now

      - name: Install Site Dependencies & Build
        working-directory: './SuiteDocs Site'
        run: |
          npm install
          npm run build

      - name: Commit & Push Updated Documentation
        run: |
          git config --global user.name 'SuiteDocs Automation [Bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add suite_script_21_complete.json SuiteScript_2.1_Modules_Reference.pdf sync_config.json "SuiteDocs Site/public/data" "SuiteDocs Site/public/downloads"
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync: update SuiteScript 2.1 documentation & PDF [skip ci]" && git push)

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './SuiteDocs Site/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
